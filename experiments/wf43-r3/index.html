<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WF43 R3 Safari gate</title><style>body{background:#10241a;color:#f6f3df;font:16px system-ui;margin:0}header{padding:16px;background:#1b3626}#view{height:55dvh;min-height:320px;overflow:hidden;position:relative;touch-action:none;background:#395e3a}#world{position:absolute;width:1100px;height:720px;background:repeating-linear-gradient(35deg,#385b30 0 28px,#406934 28px 56px);transform-origin:0 0}#hero{position:absolute;left:550px;top:360px;font-size:42px}#controls{display:flex;justify-content:center;gap:9px;padding:12px}button{font-size:24px;padding:15px;background:#315e43;color:white;border:1px solid #b5ad7d;border-radius:12px;touch-action:none}#status{padding:12px}small{color:#ddd}</style><header><strong>WF43 R3 — Safari Runtime & Controls Gate</strong><div><small>Diagnostic only: actual PixelLab PNG and Ground not yet deployed</small></div></header><div id="view"><div id="world"><span id="hero">🧍</span></div></div><div id="controls"><button data-x="-1" data-y="0">◀</button><button data-x="0" data-y="-1">▲</button><button data-x="0" data-y="1">▼</button><button data-x="1" data-y="0">▶</button></div><div id="controls"><button id="minus">− Zoom</button><button id="plus">+ Zoom</button></div><div id="status">JavaScript: NOT STARTED</div><script>window.addEventListener('error',e=>document.getElementById('status').textContent='ERROR: '+e.message);(()=>{'use strict';const view=document.getElementById('view'),world=document.getElementById('world'),hero=document.getElementById('hero'),status=document.getElementById('status');let x=550,y=360,z=1,dx=0,dy=0,last=0;function draw(){const s=Math.max(.5,Math.min(2,z));world.style.transform='translate('+(view.clientWidth/2-x*s)+'px,'+(view.clientHeight/2-y*s)+'px) scale('+s+')';hero.style.left=x+'px';hero.style.top=y+'px';status.textContent='Runtime PASS | Position '+Math.round(x)+','+Math.round(y)+' | Zoom '+Math.round(z*100)+'% | Camera PASS | PNG NOT DEPLOYED'}function direction(a,b){dx=a;dy=b}document.querySelectorAll('[data-x]').forEach(b=>{const a=+b.dataset.x,c=+b.dataset.y;b.addEventListener('pointerdown',e=>{e.preventDefault();direction(a,c);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>direction(0,0)));b.addEventListener('click',()=>{x=Math.max(0,Math.min(1100,x+a*24));y=Math.max(0,Math.min(720,y+c*24));draw()})});document.getElementById('minus').onclick=()=>{z=Math.max(.5,z-.15);draw()};document.getElementById('plus').onclick=()=>{z=Math.min(2,z+.15);draw()};function frame(t){const dt=Math.min(50,t-last)/1000;last=t;if(dx||dy){x=Math.max(0,Math.min(1100,x+dx*180*dt));y=Math.max(0,Math.min(720,y+dy*180*dt));draw()}requestAnimationFrame(frame)}window.addEventListener('resize',draw);draw();requestAnimationFrame(frame)})();</script><noscript>JavaScript disabled; open HTTPS page in Safari</noscript>
