<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"><title>WF41 — Graph Walk Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b19;color:#e6f3e7;font:14px system-ui}header{padding:12px 14px;background:#20372f}h1{font-size:18px;margin:0 0 4px}.note{color:#c8c7a1;font-size:12px}canvas{display:block;width:100%;height:calc(100dvh - 210px);touch-action:none;background:#0c1513}.controls{display:flex;flex-wrap:wrap;gap:8px;padding:9px;background:#20372f;justify-content:center}button{background:#355b4c;color:white;border:1px solid #668c73;border-radius:8px;padding:10px 14px;font-size:16px;min-width:48px}button:disabled{opacity:.4}#status{padding:8px 12px;font-size:12px;background:#182b24;min-height:35px}small{color:#b8cabb}
</style></head><body><header><h1>Whispering Forest · WF41</h1><div class="note">EXPERIMENT · 128×128 logical grid · Graph-only walking · UNKNOWN ≠ walkable</div></header><canvas id="map" aria-label="WF41 graph preview"></canvas><div id="status">Loading original WF41 graph…</div><div class="controls"><button id="up">↑</button><button id="left">←</button><button id="down">↓</button><button id="right">→</button><button id="zin">＋</button><button id="zout">－</button><button id="home">Center</button></div><script>
'use strict';
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
let graph=null, nodes=[], edges=[], byId=new Map(), adj=new Map(), player=null, scale=5, offX=0, offY=0, drag=null;
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);draw()}addEventListener('resize',resize);
function key(n){return n.x+','+n.y+','+n.surfaceId}
function moveTo(n){player=n;status.textContent='Graph-only · ('+n.x+','+n.y+') '+n.surfaceId+' · '+n.kind+' · elevation '+n.elevation+' · physical collision NOT VERIFIED';draw()}
function neighbors(){return (adj.get(player.id)||[]).map(id=>byId.get(id)).filter(Boolean)}
function step(dx,dy){if(!player)return;const next=neighbors().find(n=>n.x-player.x===dx&&n.y-player.y===dy);if(next)moveTo(next);else status.textContent='BLOCKED: no verified graph edge in that direction (not a terrain collision verdict)'}
function center(){if(!player)return;offX=canvas.width/2-player.x*scale*devicePixelRatio;offY=canvas.height/2-player.y*scale*devicePixelRatio;draw()}
function draw(){if(!canvas.width)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#0d1714';ctx.fillRect(0,0,canvas.width,canvas.height);if(!graph)return;const s=scale*devicePixelRatio;ctx.save();ctx.translate(offX,offY);ctx.strokeStyle='#244337';ctx.lineWidth=Math.max(1,devicePixelRatio);ctx.strokeRect(0,0,128*s,128*s);ctx.strokeStyle='#527c65';ctx.lineWidth=Math.max(1,devicePixelRatio);ctx.beginPath();for(const e of edges){const a=byId.get(e.a),b=byId.get(e.b);if(!a||!b)continue;ctx.moveTo((a.x+.5)*s,(a.y+.5)*s);ctx.lineTo((b.x+.5)*s,(b.y+.5)*s)}ctx.stroke();for(const n of nodes){ctx.fillStyle=n.elevation>=2?'#e6bf78':n.elevation>=1?'#89bd8b':'#57a6b3';ctx.fillRect((n.x+.5)*s-2*devicePixelRatio,(n.y+.5)*s-2*devicePixelRatio,4*devicePixelRatio,4*devicePixelRatio)}if(player){ctx.beginPath();ctx.arc((player.x+.5)*s,(player.y+.5)*s,Math.max(5*devicePixelRatio,s*.6),0,Math.PI*2);ctx.fillStyle='#ffed79';ctx.fill();ctx.strokeStyle='#202020';ctx.stroke()}ctx.restore();ctx.fillStyle='#c9ddc8';ctx.font=(12*devicePixelRatio)+'px system-ui';ctx.fillText('Graph route = simulation only | Unknown terrain blocked',10*devicePixelRatio,20*devicePixelRatio)}
function zoom(f){scale=Math.max(2,Math.min(32,scale*f));center()}
document.getElementById('up').onclick=()=>step(0,-1);document.getElementById('down').onclick=()=>step(0,1);document.getElementById('left').onclick=()=>step(-1,0);document.getElementById('right').onclick=()=>step(1,0);document.getElementById('zin').onclick=()=>zoom(1.3);document.getElementById('zout').onclick=()=>zoom(1/1.3);document.getElementById('home').onclick=center;
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();step(...m[e.key])}});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:offX,oy:offY,moved:false}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;offX=drag.ox+dx*devicePixelRatio;offY=drag.oy+dy*devicePixelRatio;draw()});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const wasDrag=drag.moved;drag=null;if(wasDrag||!player)return;const x=Math.floor((e.offsetX*devicePixelRatio-offX)/(scale*devicePixelRatio)),y=Math.floor((e.offsetY*devicePixelRatio-offY)/(scale*devicePixelRatio));const n=neighbors().find(n=>n.x===x&&n.y===y);if(n)moveTo(n);else status.textContent='Tap only a directly connected graph node; unknown terrain is not walkable'});
async function init(){resize();try{const response=await fetch('../../verification/fixtures/wf41-surface-graph.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);graph=await response.json();if(!Array.isArray(graph.nodes)||!Array.isArray(graph.edges))throw Error('invalid graph schema');nodes=graph.nodes;edges=graph.edges;for(const n of nodes){if(!Number.isInteger(n.x)||!Number.isInteger(n.y)||n.x<0||n.x>=128||n.y<0||n.y>=128||byId.has(n.id))throw Error('invalid node');byId.set(n.id,n);adj.set(n.id,[])}for(const e of edges){if(!byId.has(e.a)||!byId.has(e.b))throw Error('dangling edge');adj.get(e.a).push(e.b);adj.get(e.b).push(e.a)}if(!nodes.length)throw Error('empty graph');moveTo(nodes[0]);center();status.textContent='Loaded '+nodes.length+' nodes / '+edges.length+' edges. Tap adjacent node or use arrows. Collision NOT VERIFIED.'}catch(err){status.textContent='FAIL: cannot load verified fixture: '+err.message+' — walking disabled';console.error(err)}}init();
</script></body></html>
