name: Validate Prototype

on:
  push:
    branches: [main, 'port/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required prototype files
        run: |
          test -f index.html
          test -f README_TH.txt
          test -f css/style.css
          test -f js/data.js
          test -f js/battle.js
          test -f js/battle-ui.js
          test -f js/world.js
          test -f js/main.js
          test -f js/card-collection.js
          test -f assets/icon.svg
          test -f assets/apple-touch-icon.png

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

  full-regression-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit, integration, regression, and mutation tests
        working-directory: verification
        run: npm run all

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: verification
        run: npm install --no-save playwright

      - name: Install Chromium
        working-directory: verification
        run: npx playwright install --with-deps chromium

      - name: Run real-browser save and game smoke tests
        working-directory: verification
        run: npm run browser
