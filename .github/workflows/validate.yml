name: Validate Prototype

on:
  push:
    branches: [main, feature/prototype-0.2-character-save, feature/card-collection-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required prototype files
        run: |
          test -f index.html
          test -f README_TH.txt
          test -f css/style.css
          test -f js/data.js
          test -f js/battle.js
          test -f js/battle-ui.js
          test -f js/world.js
          test -f js/main.js
          test -f assets/icon.svg
          test -f assets/apple-touch-icon.png
          test -f js/save.js
          test -f tests/save.test.js

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tests/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run save-system unit tests
        run: node --test tests/save.test.js

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run character creation and continue browser smoke test
        run: node tests/browser-smoke.cjs
